name: OpenWrt Build

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: "Select the runner to use"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
          - "ubuntu-latest"
          - "self-hosted"
      clean_build:
        description: "Clean build_dir/staging_dir (not needed on ephemeral runners)"
        required: true
        default: false
        type: boolean
      distclean_build:
        description: "Distclean, including build_dir/staging_dir (dl and ccache are preserved)"
        required: true
        default: false
        type: boolean
      prebuilt_gcc:
        description: "Use a matching prebuilt GCC toolchain (published automatically)"
        required: true
        default: true
        type: boolean
      prebuilt_gcc_version:
        description: "Override prebuilt toolchain release tag (empty = derive from toolchain sources)"
        default: ""
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner_type }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
          clean: ${{ github.event.inputs.runner_type != 'self-hosted' }}

      - name: Set Build Environment
        run: |
          echo "CLEAN_BUILD=${{ github.event.inputs.clean_build }}" >> $GITHUB_ENV
          echo "DISTCLEAN_BUILD=${{ github.event.inputs.distclean_build }}" >> $GITHUB_ENV

      - name: Compute Toolchain Identity
        id: toolchain-meta
        run: |
          TOOLCHAIN_KEY=$(git rev-parse HEAD:toolchain | cut -c1-10)
          CONFIG_KEY=$( { grep -E '^(COMMON_CFLAGS|TUNING_CFLAGS|CONFIG_(TOOLCHAINOPTS|GCC_USE_VERSION_[0-9]+|GCC_USE_GRAPHITE|USE_MOLD))=' build.sh || true; } | sort | sha256sum | cut -c1-8)
          KERNEL_KEY=$(cat target/linux/mediatek/Makefile target/linux/generic/kernel-* 2>/dev/null | sha256sum | cut -c1-8)
          TOOLCHAIN_ID="${TOOLCHAIN_KEY}-${CONFIG_KEY}-${KERNEL_KEY}"

          echo "id=${TOOLCHAIN_ID}" >> "$GITHUB_OUTPUT"
          echo "tag=aarch64-openwrt-linux-musl-toolchain-${TOOLCHAIN_ID}" >> "$GITHUB_OUTPUT"
          echo "Toolchain identity: ${TOOLCHAIN_ID}"

      - name: Resolve Prebuilt Toolchain
        id: prebuilt
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "auto=false" >> "$GITHUB_OUTPUT"
          echo "asset=" >> "$GITHUB_OUTPUT"
          echo "format=" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event.inputs.prebuilt_gcc }}" != "true" ]; then
            echo "Prebuilt toolchain disabled; using the source build/cache."
            exit 0
          fi

          OVERRIDE="${{ github.event.inputs.prebuilt_gcc_version }}"
          if [ -n "$OVERRIDE" ]; then
            TAG="$OVERRIDE"
          else
            TAG="${{ steps.toolchain-meta.outputs.tag }}"
            echo "auto=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if printf '%s\n' "$ASSETS" | grep -qx "${TAG}.tar.zst"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "asset=${TAG}.tar.zst" >> "$GITHUB_OUTPUT"
            echo "format=tar.zst" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$ASSETS" | grep -qx "${TAG}.tar.gz.zst"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "asset=${TAG}.tar.gz.zst" >> "$GITHUB_OUTPUT"
            echo "format=tar.gz.zst" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No prebuilt toolchain release asset for '${TAG}'; building from source."
          fi

      - name: Prepare Cache Paths
        run: |
          mkdir -p .ccache dl

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          enableCrossOsArchive: true
          path: .ccache
          key: ccache-${{ github.ref_name }}-${{ steps.toolchain-meta.outputs.id }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ github.ref_name }}-${{ steps.toolchain-meta.outputs.id }}-

      - name: Cache Downloads
        uses: actions/cache@v5
        with:
          path: dl
          key: dl-${{ github.ref_name }}

      - name: Restore Toolchain Cache
        id: toolchain-cache
        if: ${{ steps.prebuilt.outputs.available != 'true' && github.event.inputs.clean_build != 'true' && github.event.inputs.distclean_build != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: toolchain-${{ runner.os }}-${{ steps.toolchain-meta.outputs.id }}

      - name: Download Toolchain from Release
        if: ${{ steps.prebuilt.outputs.available == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.prebuilt.outputs.tag }}"
          ASSET="${{ steps.prebuilt.outputs.asset }}"
          FORMAT="${{ steps.prebuilt.outputs.format }}"

          echo "Downloading $ASSET from release $RELEASE_TAG..."
          gh release download "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "$ASSET" \
              --clobber

          mkdir -p "$RELEASE_TAG"
          if [ "$FORMAT" = "tar.zst" ]; then
              zstd -d -f "$ASSET" -o "${RELEASE_TAG}.tar"
              tar -xf "${RELEASE_TAG}.tar" -C "$RELEASE_TAG"
              rm "${RELEASE_TAG}.tar"
          else
              zstd --decompress --force "$ASSET"
              tar -xf "${RELEASE_TAG}.tar.gz" -C "$RELEASE_TAG"
              rm "${RELEASE_TAG}.tar.gz"
          fi
          rm "$ASSET"
          du -sh "$RELEASE_TAG"

          echo "PREBUILT_GCC_VERSION=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Build Local Docker Image
        run: |
          flags=$(awk -F: '/^flags/ {print " " $2 " "; exit}' /proc/cpuinfo)

          check_support() {
            for flag in "$@"; do
                case "${flags}" in
                    *" ${flag} "*) continue ;;
                    *) return 1;;
                esac
            done
            return 0
          }

          TARGET_IMAGE="cachyos/cachyos"

          if check_support avx avx2 bmi1 bmi2 f16c fma abm movbe xsave; then
            TARGET_IMAGE="cachyos/cachyos-v3"
          fi

          if check_support avx512f avx512bw avx512cd avx512dq avx512vl; then
            TARGET_IMAGE="cachyos/cachyos-v4"
          fi

          USER_ID=$(id -u)

          cat << 'EOF' > Dockerfile
          ARG TARGET_IMAGE
          FROM ${TARGET_IMAGE:-cachyos}:latest
          ARG USER_ID
          RUN pacman-key --init && pacman-key --populate archlinux && \
              pacman -Syu --noconfirm && \
              pacman -S --needed --noconfirm \
              base-devel git bash aria2 bzip2 libelf libxslt ncurses \
              openssl rsync swig time unzip util-linux wget which \
              asciidoc help2man intltool perl-extutils-makemaker python-setuptools \
              zip curl ccache ninja inetutils # zlib
          RUN useradd -m -u ${USER_ID} builduser
          USER builduser
          ENV PATH="/usr/bin/core_perl:$PATH"
          EOF

          export DOCKER_BUILDKIT=1
          docker buildx build \
            --build-arg TARGET_IMAGE=$TARGET_IMAGE \
            --build-arg USER_ID=$USER_ID \
            -t openwrt-builder \
            --load .

      - name: Run Build Script in Docker
        run: |
          docker run --rm \
            --env-file $GITHUB_ENV \
            -e PREBUILT_GCC_VERSION=${PREBUILT_GCC_VERSION:-} \
            -e CLEAN_BUILD=$CLEAN_BUILD \
            -e DISTCLEAN_BUILD=$DISTCLEAN_BUILD \
            -e USE_CCACHE=1 \
            -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_DIR=/workspace/.ccache \
            -e CCACHE_MAXSIZE=8G \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            openwrt-builder \
            bash -c '
              git config --global --add safe.directory /workspace && \
              git config --global user.name "Jebaitedneko" && \
              git config --global user.email "Jebaitedneko@gmail.com" && \
              PREBUILT_GCC_VERSION=${PREBUILT_GCC_VERSION:-} \
              CLEAN_BUILD=$CLEAN_BUILD \
              DISTCLEAN_BUILD=$DISTCLEAN_BUILD \
                ./build.sh
            '

      - name: Save Toolchain Cache
        if: ${{ steps.prebuilt.outputs.available != 'true' && steps.toolchain-cache.outputs.cache-hit != 'true' && github.event.inputs.clean_build != 'true' && github.event.inputs.distclean_build != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build_dir/toolchain-*
            staging_dir/toolchain-*
          key: toolchain-${{ runner.os }}-${{ steps.toolchain-meta.outputs.id }}

      - name: Publish Prebuilt Toolchain
        if: ${{ steps.prebuilt.outputs.auto == 'true' && steps.prebuilt.outputs.available != 'true' && github.event.inputs.runner_type != 'self-hosted' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.prebuilt.outputs.tag }}"
          TOOLCHAIN_DIR=$(find staging_dir -maxdepth 1 -mindepth 1 -type d -name 'toolchain-*' | sort | head -n 1)

          if [ -z "$TOOLCHAIN_DIR" ] || [ ! -d "$TOOLCHAIN_DIR/bin" ]; then
            echo "::warning::No source-built toolchain found in staging_dir; skipping publication."
            exit 0
          fi

          ASSET="${TAG}.tar.zst"
          echo "Packaging $TOOLCHAIN_DIR as $ASSET..."
          tar -C "$TOOLCHAIN_DIR" -cf - . | zstd -T0 -19 -o "$ASSET"
          ls -lh "$ASSET"

          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --prerelease \
              --title "Prebuilt toolchain ${TAG#aarch64-openwrt-linux-musl-}" \
              --notes "Automatically built from ${GITHUB_SHA} for ${TAG}."
          fi

          gh release upload "$TAG" "$ASSET" --repo "${{ github.repository }}" --clobber
          rm -f "$ASSET"

      - name: Package Artifacts
        run: |
          if [ -d "bin/targets/mediatek/filogic" ]; then
            cd bin/targets/mediatek/filogic
            VERSION=$(cat version.buildinfo 2>/dev/null || echo "unknown")
            ZIP_NAME="images-${VERSION}.zip"
            TARGET_PATH="../../../../${ZIP_NAME}"

            if [ -f "$TARGET_PATH" ]; then
                echo "Found existing artifact $ZIP_NAME. Deleting to ensure a fresh package..."
                rm "$TARGET_PATH"
            fi

            find . -maxdepth 1 -type f -print0 | xargs -0 zip "$TARGET_PATH"

            echo "VERSION=${VERSION}" >> $GITHUB_ENV
            echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          else
            echo "Build output directory not found!"
            exit 1
          fi

      - name: Upload to tmpfiles.org
        run: |
          RESPONSE=$(curl -F "file=@${ZIP_NAME}" https://tmpfiles.org/api/v1/upload)
          echo "Upload Response: $RESPONSE"
          URL=$(echo $RESPONSE | sed 's/.*"url":"\([^"]*\)".*/\1/')
          DOWNLOAD_URL=$(echo $URL | sed 's/tmpfiles.org\//tmpfiles.org\/dl\//')
          echo "Artifact uploaded to: $DOWNLOAD_URL"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION exists. Updating assets..."
            gh release upload "$VERSION" "$ZIP_NAME" --clobber
          else
            echo "Creating new release $VERSION..."
            gh release create "$VERSION" "$ZIP_NAME" \
              --title "OpenWrt Firmware $VERSION"
          fi
